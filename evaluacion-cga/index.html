<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1C1C" />
    <meta name="description" content="Sistema de evaluación de habilidades — Escuela de Fútbol, Club Gimnástico Alemán de Temuco." />
    <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg" />

    <!-- Para dejarla como ícono en el teléfono.

         Sin esto, al agregarla a la pantalla de inicio el iPhone usa una
         captura de la pantalla como ícono y la abre con la barra del navegador
         encima. El apple-touch-icon pone el escudo; apple-mobile-web-app-capable
         la abre a pantalla completa. Android usa el manifiesto para lo mismo, y
         además ofrece "Instalar aplicación" en vez del atajo genérico. -->
    <link rel="apple-touch-icon" href="./brand/icono-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evaluación CGA" />

    <title>Evaluación de Habilidades — Escuela de Fútbol CGA</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
