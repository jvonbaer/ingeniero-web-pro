# Despliegue de Fundación Anímate. En Netlify, usar la carpeta animate-web como "base".
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SITIO DE PRUEBA: pide a los buscadores que no lo indexen.
# QUITAR este bloque (y el Disallow de public/robots.txt) al lanzar el sitio definitivo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
